<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OG Banner Generator - Youssef EL-Gendy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060911;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 18px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #0F172A;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid #1E293B;
    }
    button, label.btn {
      background: #10B981;
      color: #041019;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover, label.btn:hover { background: #34D399; }
    label.btn.secondary {
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid #334155;
    }
    input[type="file"] { display: none; }
    canvas {
      width: 500px;
      height: 500px;
      border-radius: 14px;
      border: 1px solid #1E293B;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <label class="btn secondary">
      1. اختيار صورتك (profile.webp)
      <input type="file" id="photoInput" accept="image/*" />
    </label>
    <button id="downloadBtn">2. تحميل og-square.png (1200×1200)</button>
  </div>

  <canvas id="bannerCanvas" width="1200" height="1200"></canvas>

  <script>
    const canvas = document.getElementById('bannerCanvas');
    const ctx = canvas.getContext('2d');
    const photoInput = document.getElementById('photoInput');
    const downloadBtn = document.getElementById('downloadBtn');
    let userImg = null;

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => { userImg = img; draw(); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function draw() {
      const W = 1200, H = 1200;
      const marginX = 95;

      // 1. Dark Background matching site
      ctx.fillStyle = '#090D16';
      ctx.fillRect(0, 0, W, H);

      // 2. Emerald & Cyan Ambient Glows (matching portfolio hero)
      const glowRight = ctx.createRadialGradient(875, 345, 30, 875, 345, 450);
      glowRight.addColorStop(0, 'rgba(16, 185, 129, 0.24)');
      glowRight.addColorStop(0.55, 'rgba(6, 182, 212, 0.12)');
      glowRight.addColorStop(1, 'rgba(9, 13, 22, 0)');
      ctx.fillStyle = glowRight;
      ctx.fillRect(0, 0, W, H);

      const glowLeft = ctx.createRadialGradient(220, 750, 20, 220, 750, 420);
      glowLeft.addColorStop(0, 'rgba(16, 185, 129, 0.10)');
      glowLeft.addColorStop(1, 'rgba(9, 13, 22, 0)');
      ctx.fillStyle = glowLeft;
      ctx.fillRect(0, 0, W, H);

      // 3. Subtle Matrix/Cyber Grid
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.05)';
      ctx.lineWidth = 1.5;
      for (let x = 0; x <= W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y <= H; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // 4. Top-Left Status Badge (matching site navbar)
      ctx.fillStyle = 'rgba(16, 185, 129, 0.10)';
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(marginX, 115, 250, 48, 24);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#10B981';
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillText('● ONLINE', marginX + 26, 146);

      // 5. Circular Radar Frame + Portrait (Top-Right)
      const cx = 875, cy = 345, radius = 190;

      // Outer Radar Rings
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 48, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.14)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, radius + 22, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.30)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Portrait Clip
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = '#0F172A';
      ctx.fill();
      ctx.clip();

      if (userImg) {
        const scale = Math.max((radius * 2) / userImg.width, (radius * 2) / userImg.height);
        const drawW = userImg.width * scale;
        const drawH = userImg.height * scale;
        ctx.drawImage(userImg, cx - drawW / 2, cy - drawH / 2 + 12, drawW, drawH);

        // Teal/Emerald tint overlay at bottom of avatar like site
        const tint = ctx.createLinearGradient(0, cy - radius, 0, cy + radius);
        tint.addColorStop(0, 'rgba(6, 182, 212, 0.12)');
        tint.addColorStop(1, 'rgba(16, 185, 129, 0.22)');
        ctx.fillStyle = tint;
        ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
      } else {
        ctx.fillStyle = '#94A3B8';
        ctx.font = '600 22px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('اختار صورتك', cx, cy + 8);
        ctx.textAlign = 'left';
      }
      ctx.restore();

      // Main Glowing Ring Border
      const ringGrad = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
      ringGrad.addColorStop(0, '#06B6D4');
      ringGrad.addColorStop(1, '#10B981');
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = ringGrad;
      ctx.lineWidth = 5;
      ctx.stroke();

      // 6. Main Typography (Matching Portfolio Hero)
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 102px Inter, sans-serif';
      ctx.fillText('Youssef', marginX, 685);

      ctx.fillStyle = '#10B981';
      ctx.font = '800 102px Inter, sans-serif';
      ctx.fillText('EL-Gendy', marginX, 795);

      // Role Line
      ctx.font = '700 38px Inter, sans-serif';
      ctx.fillStyle = '#E2E8F0';
      const rolePart1 = 'Cybersecurity Instructor & ';
      ctx.fillText(rolePart1, marginX, 875);
      const part1W = ctx.measureText(rolePart1).width;
      ctx.fillStyle = '#22D3EE';
      ctx.fillText('AI Developer', marginX + part1W, 875);

      // Terminal Tagline
      ctx.fillStyle = '#10B981';
      ctx.font = '700 26px "JetBrains Mono", monospace';
      ctx.fillText('>_', marginX, 932);
      ctx.fillStyle = '#94A3B8';
      ctx.font = '500 26px "JetBrains Mono", monospace';
      ctx.fillText(' Offensive Security & AI-Driven Solutions', marginX + 36, 932);

      // Divider & Domain
      ctx.fillStyle = '#1E293B';
      ctx.fillRect(marginX, 980, W - marginX * 2, 2);

      ctx.fillStyle = '#64748B';
      ctx.font = '500 28px "JetBrains Mono", monospace';
      ctx.fillText('youssef-elgendy.vercel.app', marginX, 1038);
    }

    document.fonts.ready.then(draw);
    draw();

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'og-square.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
